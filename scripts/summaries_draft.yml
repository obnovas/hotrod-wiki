cars/beast-iii.md: "Chet Herbert's Beast III was finished in a rush: its body arrived after the 1952 Nationals had started, volunteers assembled it at Chrisman & Sons Garage in Compton, and Herbert went three or four days without sleep."
cars/hill-bros-red-baron.md: "The Hill brothers' \"Red Baron\" Willys gasser and Pete Hill's 1967 mock apology letter to Drag News, told mostly through oral history and documents gathered on a Gasser Legends page."
cars/techniques-and-styles.md: "A short guide to how customizing and hot rod styles changed: from 1930s \"restyling\" and the \"fake Cord\" to metal-finish versus lead, the lead-sled era and Pro Street."
companies/comp-cams-rhs.md: "In 1967 three Memphis drag racers who liked tinkering with Oldsmobile engines set up Racing Head Service in a basement. It grew into COMP Cams."
companies/crane-cams.md: "Harvey Crane decided a store-bought camshaft \"wasn't accurately made,\" ground his own, and built Crane Cams in Florida, from Hallandale to Daytona."
companies/edelbrock-slingshot.md: "Vic Edelbrock drove his roadster to Muroc, pulled the fenders off to race and bolted them back on to drive home. This is the story of the kid from Kansas, the Thickstun detour and the shop after the war."
companies/holley.md: "Holley began with George Holley's motor bicycle at the 1901 Pan-American Exposition in Buffalo. The Bradford, Pa., brothers' company went on to carburetors, Detroit and the aftermarket."
companies/hooker-headers.md: "Gary Hooker couldn't afford headers for his new 1962 Chevrolet 409, so he made his own, longer and with larger tubing, and turned them into a business."
companies/hurst-campbell.md: "Hurst-Campbell, the shifter company in Warminster, Pa., called everyone an \"associate.\" Here is how George Hurst and Bill Campbell got from a two-car garage to a 58,000-square-foot plant."
companies/jegs.md: "Jeg Coughlin Sr. got tired of waiting for parts to come by mail from far away, so in 1960 he opened JEGS on East Eleventh Avenue in Columbus, Ohio, half garage and half parts store."
companies/lakewood-industries.md: "Joe Schubeck raced a dragster out of Lakewood, Ohio, and built a steel bellhousing to hold the shrapnel from an exploding flywheel. It became Lakewood Industries."
companies/logghe-stamping.md: "The Logghe brothers turned their father's Fraser, Michigan, bracketry shop into a chassis house for dragsters and the flip-top Funny Cars of 1966."
companies/mickey-thompson.md: "Mickey Thompson dug the post holes for his own drag strip after his shift at the Los Angeles Times. This page follows him from El Monte to tires, wheels and the Pontiac years."
companies/moon-equipment.md: "From Moon's Café in Santa Fe Springs to the fuel block and the Mooneyes logo, this is the story of Dean Moon and its rebirth as Mooneyes USA."
companies/moroso.md: "Dick Moroso started in a basement in Greenwich, Conn., and in 1983 explained why he had bought a falling-down dragstrip in Florida: \"We have too many industrial parks and not enough racetracks.\""
companies/mr-gasket.md: "Joe Hrudka made better exhaust gaskets with his father-in-law in Cleveland and sold them from the trunk of his '57 Chevy tow car. Mr. Gasket went from that trunk to Wall Street."
companies/prewar-speed-shops.md: "Before everyone got into the act there were George Wight's Bell Auto Parts, Lee Chapel, Karl and Veda Orr, and Jim White: the first speed shops."
companies/southern-california-plating.md: "Leonard DeBell's Southern California Plating Co. advertised itself with customized delivery trucks wearing DuVall-designed grilles, bumpers and V-windshields."
companies/summit-racing.md: "Summit Racing's first store was the basement of a donut shop in Stow, Ohio, in 1968. The story runs through two little ads and a Corvette that stayed."
companies/web-of-influence.md: "An interactive map of who fed whom: every line between two names is backed by a quoted passage on one of this wiki's pages, checked at every build."
customs/hirohata-mercury.md: "Bob Hirohata's 1951 Mercury, chopped by Sam and George Barris of Barris Kustom: how it was built, and what became of the car and its owner."
customs/kkoa-lead-sled-revival.md: "The Kustom Kemps of America started with 14 charter members in Wichita in 1980 and brought the lead sled back with its first Lead Sled Spectacular in 1981."
drag-racing/akron-fulton-airport.md: "Akron's Fulton Airport gave northeast Ohio one of the Midwest's earliest organized drag strips. A 2016 Ohio historical marker honors it and its racers."
drag-racing/ames-drag-strip-nightcrawlers.md: "An Iowa State College math professor stood up for the Nightcrawlers hot rod club and served as steward of the Ames Drag Strip, which ran from 1957 to 1959."
drag-racing/beardstown-drag-strip.md: "Beardstown, a packing-house town on the Illinois River, drew 2,000 people to its new drag strip in 1967. By 1970 Garlits was on the bill."
drag-racing/belleville-gear-jammers.md: "The Belleville Gear Jammers made members pay half of any traffic fine to the club and ran airfield drags. Their hunt for a strip across the river from St. Louis ran from 1952 to 1959."
drag-racing/detroit-cordova.md: "In 1957 an unknown Don Garlits learned to build a fuel pump at Cordova and earned a \"name\" there. The page also covers the ATAA World Series of Drag Racing and Detroit's strips."
drag-racing/escanaba-dragns.md: "Kemp Sabourin and Bill Miller started Escanaba's Drag-n's hot rod club above an auto shop in Michigan, with rules that stressed safe driving (1954–55)."
drag-racing/fox-valley-road-deacons-gas-ketts.md: "Appleton, Wisconsin's car clubs, one of them all girls, ran a car show in a shopping mall, helped stranded motorists and wrote to the paper asking for a drag strip (1962–68)."
drag-racing/great-bend-srca.md: "How a Kansas car club and its city brought NHRA's first national event, the 1955 National Championship Drags, to Great Bend."
drag-racing/half-day-ataa-maremont.md: "A Chicago muffler maker put its name on a drag strip at Half Day, Illinois, and then insisted on seat belts. This is the story of the Automobile Timing Association of America (1952–55)."
drag-racing/hanover-adams-county-clubs.md: "The Gettysburg paper's small columns show hot rod clubs around Hanover and Gettysburg asking neighbors for permission to meet, touring the Lions clubs and picking jacket colors (1956–59)."
drag-racing/high-school-hot-rod-clubs.md: "In 1950s and 1960s yearbooks, the Hot Rod Club sits between the Glee Club and the Future Business Leaders. Here is what the schools and their advisers recorded (1953–1967)."
drag-racing/houston-freeway-dragstrip.md: "Houston Freeway Dragstrip, near Dickinson, Texas: the 1958 showdown, the Gay family years and the touring racers who stayed at their house."
drag-racing/indiana-small-town-clubs.md: "In 1956 twenty-four young men in Decatur, Indiana, joined a hot rod club that said it had police blessing. This page follows small-town Indiana clubs from 1953 to 1958."
drag-racing/inyokern-dust-devils.md: "A sheriff started it and a federal agency ended it: for about 51 years a volunteer car club, the Dust Devils, ran a quarter-mile at the Inyokern airport in Kern County (1954–2005)."
drag-racing/kansas-city-timing-association.md: "\"Kansas City police, unable to coerce Hot Rodders, joined them.\" How a police detective, whose son raced, helped Kansas City's hot rodders get a strip (1955–66)."
drag-racing/kingston-igniters.md: "The Kingston Igniters spent four years looking for a legal place to run in New York's Hudson Valley. Along the way they handed out safety tags and helped Poughkeepsie start a club (1955–59)."
drag-racing/kk-sports-arena-kaukauna.md: "Wisconsin's Fox River valley asked for a drag strip for four years. The answer was KK Sports Arena, in a farmer's ravine south of Kaukauna (1960–68)."
drag-racing/march-1957-drag-strip-survey.md: "In March 1957 newspapers across the country argued about drag strips. Here are the cases for and against, and a Denver puzzle we have not solved."
drag-racing/marin-cotati-strips.md: "Marin County's hot rodders had six clubs and a lawyer, but nowhere to run. A strip at an old Navy field at Cotati lasted ten weeks in 1956, and Marin kept asking until 1964."
drag-racing/modesto-century-toppers.md: "Modesto's first hot rod club, the Century Toppers, met in the garage that launched a famous customizer and worked with the California Highway Patrol in 1949 (1946–50)."
drag-racing/new-york-towns-panel-1957.md: "In February 1957 a sheriff, a police chief and a safety man argued at a convention of the New York State Association of Towns over whether hot rodders were \"becoming too hot to handle.\""
drag-racing/pennsauken-central-airport-1958.md: "On a Tuesday night in May 1958, Pennsauken's police chief used fire hoses and tear gas on street racers at Camden's old airport. The next day bulldozers tore up the runways."
drag-racing/planners-report-1955.md: "In May 1955 the American Society of Planning Officials told city planners they would have to find sites for drag strips. Its report names small towns and clubs that rarely appear in magazine histories."
drag-racing/pocono-strips.md: "The Ridge Runners never got their own strip. From 1958 to 1968 Monroe County hot rodders tried a flood levee, Wind Gap, Bear Creek and an airport that wasn't."
drag-racing/pomona-choppers-fontana.md: "In 1951 Pomona's police chief told the FBI bulletin how his department stopped fighting its hot rodders and helped the Choppers club get a legal drag strip at Fontana."
drag-racing/portsmouth-kustom-kouriers.md: "When the telephones went dead in Portsmouth, Ohio, in 1956, the Kustom Kouriers hot rod club carried messages for the city."
drag-racing/quaker-city-salem.md: "Dick Mossey laid out Quaker City Drag Strip on farmland north of Salem, Ohio, with a silo for a timing tower and headlights on a pole for night racing (1957–77)."
drag-racing/recreation-1957-pro-and-con.md: "In June 1957 the recreation directors' trade magazine asked whether towns should sponsor drag racing, and printed a case for and a case against."
drag-racing/sedalia-big-sir.md: "Sedalia, Missouri, argued about a drag strip for more than a decade. When the Big S.I.R. finally broke ground, the result was half a strip (1958–70)."
drag-racing/sedalia-drag-ons.md: "Sedalia's Drag-Ons spent seven years trying to earn a drag strip and never got one. They left one of the most detailed small-town club rulebooks we have found (1957–64)."
drag-racing/semo-malden-drag-strip.md: "A year after the Air Force flight school left Malden, Missouri, local racers and the Jaycees marked a quarter-mile on the back runway, and Memphis cars came north for the trophies (1961–71)."
drag-racing/stroudsburg-ridge-runners.md: "In the Pocono Mountains, the Ridge Runners of Stroudsburg tried their own members for traffic violations, sentenced them to work details and offered to buy land for a strip (1957–64)."
eras/1930s-dry-lakes-scta.md: "In the 1920s and 1930s Los Angeles racers drove to Muroc Dry Lake and raced side by side in unruly lineups, until the timing associations and the SCTA brought the stopwatch."
eras/1950s-camgrinder-wars.md: "The cam advertisers' war in the pages of HOT ROD, from the mild headlines of 1948 to the escalating claims of the 1950s, and how much of it was real."
eras/1950s-santa-ana-drags.md: "Orange County hot rodders raced on abandoned airstrips until, by one account, a company of U.S. Marines with fixed bayonets ran them off. Then C.J. \"Pappy\" Hart opened the Santa Ana drags in 1950."
eras/1960s-drag-rags.md: "The \"drag rags\", Drag News and the other cheap weekly tabloids, were controlled neither by a sanctioning body nor by Petersen. Dave Wallace argues they recorded the truest accounts of drag racing's growth."
eras/1970s-street-rod-nationals.md: "In 1970 the Rod & Custom crew organized the first Street Rod Nationals in Peoria, though their bosses never said yes. Here is why Peoria, and how many came."
eras/1980s-pro-street.md: "Pro Street grew out of a Dayton garage in 1979. Who named it, what it looked like, and why it was not simply a Pro Stocker for the street."
media/show-circuit.md: "The first National Roadster Show in Oakland had rope barriers on water drums and about 100 cars. From there, Detroit's Autorama and Portland's Roadster Show built the show circuit."
media/street-rod-magazine-portland.md: "Before Street Rodder there was Street Rod, a 64-page monthly made in Portland, Oregon, apartments. It ran 20 issues, from October 1971 to July 1973."
media/street-rod-newspaper-serial.md: "In 1954 small-town papers ran Henry Gregor Felsen's novel Street Rod as a daily serial, so a kid in Hope, Arkansas, could follow a hot rodder's fight with city hall."
media/trend-books-kits-roth.md: "How customs reached readers and kids: Petersen's 1951 Custom Cars Trend Book, AMT's 3-in-1 kits from 1958, and Roth and Revell."
people/al-bergler.md: "Rather than pay $300 for a digger nose, Al Bergler bent one himself over a pipe. He did the aluminum work on Logghe cars, won the first Ridler Award in 1964 and campaigned the Motown Shaker."
people/alex-xydias.md: "On Army furlough in the 1940s Alex Xydias watched San Fernando Valley street races and decided to open a speed shop. He named it So-Cal."
people/arlen-vanke.md: "\"Akron\" Arlen Vanke started racing at the Akron airport strip and went on to Knafel Pontiac, Mopar and Pro Stock. Hemmings says his dual-quad Hemi work coined the word \"Vanked.\""
people/barney-navarro.md: "Barney Navarro paid for parts with his labor, machining Phil Weiand's first castings, and raced with the Glendale Strokers, a belly tank and his own manifolds."
people/bob-bartel.md: "When his clubs could not afford a drag strip, Bob Bartel cashed his Sears stock and, with local businessmen, bought farmland near the Mississippi to build Cordova."
people/chet-herbert.md: "Polio left Chet Herbert paralyzed from the chest down in 1948. He designed roller cams on a Sears lathe and raced through hired drivers."
people/dick-wells.md: "Dick Wells (1934–2010) went from Lincoln, Nebraska, to National Dragster, Hot Rod, SEMA and the NSRA. Whether he was its first president is still debated."
people/doris-herbert.md: "Doris Herbert's Drag News kept the national Standard 1320 Record List and set timing standards for reputable strips, sanctioned or not."
people/ed-almquist.md: "Ed Almquist sold speed parts by mail from Milford, Pennsylvania, starting with a vapor injector made from a Mason jar and a $12.95 log manifold."
people/ed-iskenderian.md: "Ed \"Isky\" Iskenderian was born in 1921 in Cutler, California, to Armenian immigrant parents and became the camshaft maker known as the Camfather."
people/ed-winfield.md: "Ed Winfield left school after the eighth grade and joined Harry A. Miller's shop at 14. He went on to cams, carburetors, patents and a long run of Indy 500 winners."
people/eddie-schartman.md: "\"Fast Eddie\" Schartman took out the finish-line lights on his first pass in a Logghe flip-top Comet in December 1965. This is his story in his own words."
people/fran-hernandez.md: "Fran Hernandez won a 1949 grudge race at Goleta on nitro and went on to Edelbrock, Stroppe, Autolite and Lincoln-Mercury racing."
people/gene-snow.md: "Gene Snow raced cars off his own used-car lot: \"I would win a race with a dealership car on Sunday and usually sold the winning entry the next day.\""
people/george-duvall.md: "George DuVall took a delivery job at Southern California Plating and ended up designing its bumpers, grilles, the DuVall windshield and the Hollywood Hubcap."
people/george-riley.md: "George Riley was an inventor who raced cars, planes and boats, and opened a shop in 1919 to make Model T speed equipment. Owners on a Ford forum still describe his heads."
people/howard-johansen.md: "Howard Johansen founded Howards Power & Racing Equipment, ran a twin-tank streamliner at the first SCTA Bonneville meet and raced Twin Bears on the strip."
people/jack-engle.md: "Jack Engle of the Low Flyers ground cams by hand before Isky and became one of the three camgrinders of the 1950s cam wars."
people/jimmy-summers.md: "Jimmy Summers and his brother started as street-corner fender men and opened a custom shop on Melrose Avenue across from Fairfax High."
people/joe-lunati.md: "Joe Lunati raced with a Memphis car club, ran Trouble Maker and Dixie Devil, and put his name on a line of camshafts."
people/julian-doty.md: "Julian Doty first went to Muroc in 1934 with his uncle George DuVall and spent seventy years on the lakes, from a head on layaway to the DuVall windshield patterns."
people/kong-jackson.md: "Charles \"Kong\" Jackson raced the lakes before the SCTA existed, recalled Army Jeeps breaking up a Muroc meet in 1941 and gave his name to an ignition. When he died is disputed."
people/malcolm-durham.md: "Malcolm Durham learned mechanics on tractors in Goldsboro, N.C., and raced from 1957: 409 Chevys in Washington, then a Logghe-chassised Funny Car."
people/peggy-hart.md: "Peggy Hart co-founded the Santa Ana drags with her husband C.J. and raced there, often challenging the winners at the end of the day."
people/roy-hagy.md: "Roy Hagy was a customizer who wouldn't use lead. Almost everything known about him comes from one oral source."
people/setto-postoian.md: "Detroit's Setto Postoian beat Garlits twice and in 1959 called him \"a swamp rat\" in a Drag News ad. Garlits named his cars after the insult."
people/stu-hilborn.md: "Stu Hilborn's streamliner tumbled in 1947, and he spent time in a body cast. From that car came Hilborn fuel injection and a business."
people/tom-beatty.md: "Tom Beatty's unpainted, rusty 1929 Ford roadster ran 154.63 mph in 1951. He also built a belly tank and raced with the Glendale club."
people/veda-orr.md: "When the SCTA's editors went to war, Veda Orr took over the Racing News and mailed it free to racers wherever they were stationed."
places/bobs-big-boy-river-road.md: "In the 1950s Burbank high schoolers met at Bob's Big Boy to show off their jalopies, then settled challenges on the River Road."
places/central-avenue-albuquerque.md: "Albuquerque's cruising ban on Central Avenue and its 2018 repeal, framed as letting Route 66 enthusiasts cruise legally."
places/cruising-overview.md: "An overview of the cruise strips, drive-ins and street-racing spots we can source from about 1940 to 1990: where they were and how each was policed or ended."
places/dragging-main.md: "In towns with one main street, teenagers drove from one end to the other and back until midnight and called it dragging Main. Here it is in their own words (1950s–1980s)."
places/harveys-broiler-downey.md: "Harvey and Minnie Ortner opened Harvey's Broiler in Downey in 1958, a Googie drive-in with a 65-foot sign that Tom Wolfe called \"Teenage Paris.\""
places/lake-street-university.md: "The Twin Cities cruised Lake Street in Minneapolis and University Avenue in St. Paul, from the 1950s into the early 1970s."
places/memphis.md: "Memphis racers ran at an old air base at Halls, Tennessee, and drove to meets across the Mid-South. The Memphis Rodders date from 1947."
places/midwest-east.md: "Threads from the Midwest and East: JEGS in Columbus, Bucks County strips and other scenes far from California."
places/modesto.md: "Modesto's cruise on 10th Street, the town American Graffiti was set in, and how the city policed and ended it."
places/ohio-gassers.md: "\"The Ohio Gassers\" was never a chartered club: it was a loose circle of Cleveland high-school friends and their rivals across Ohio who ran gas-class cars."
places/pacific-northwest.md: "In the Portland area the clubs organized through a council, the MHRC, which ran the Roadster Show and helped open Woodburn Dragstrip in 1961."
places/regional-scenes.md: "Hot rodding was not only a SoCal export. Other regions built their own scenes on abandoned airfields, through volunteer councils and at fairground shows."
places/summer-avenue-memphis.md: "Memphis cruised Summer Avenue, US 70, a road of drive-ins and motels, in the 1950s and 1960s."
places/texas.md: "Texas's first organized drags ran on the abandoned airfield at Caddo Mills on Aug 19, 1951: 56 cars, a $1 entry and three hand-held stopwatches."
places/twin-falls-main-avenue.md: "In 1957 the Twin Falls paper put Main Avenue's nickname, the \"drag strip,\" in quotation marks. A local club then offered to pay for a real one (1957–1965)."
places/upper-midwest.md: "The Minnesota Street Rod Association began in 1967 and by 1970 co-hosted the first Street Rod Nationals at Peoria."
places/van-nuys.md: "Cruising Van Nuys Boulevard went back to a Saturday-night parade in 1912 and drew crowds of up to 20,000 by the 1950s, until it was closed in the early 1980s."
places/westheimer-houston.md: "Houston's 1980s cruise on Westheimer Road, east through Montrose to a turnaround at Elgin and back."
places/whittier-blvd.md: "Cruising Whittier Boulevard in East Los Angeles, which the LA Times called \"an odd ritual\" in 1979, until the Sheriff's Department closed it."
places/woodward-ordinances.md: "Woodward Avenue's cruising did not end in one raid. It ended through a run of decisions by small cities, including one that banned drive-ins it did not have."
places/woodward.md: "On Woodward Avenue you backed into the drive-in so you could watch the action. The loop, the racing and how Detroit's showrooms joined in."
street-rodding/fiberglass-suppliers.md: "Fiberglass bodies for fenderless rods, from Diablo's $149.50 T roadster body in 1957 to Cal Automotive and Wescott's of Boring, Oregon."
street-rodding/nsra-early-nationals.md: "How the 1970 Street Rod Nationals in a Peoria hayfield led to the National Street Rod Association, and where the Nationals moved after that."
voices/blackie-gold.md: "Hyman \"Blackie\" Gold, interviewed in 2006, remembers starting as a grease monkey at ten, Muroc, the founding of the SCTA and Pancho Barnes' ranch."
voices/esparza-brothers.md: "Rick and Fred Esparza built a 1941 Willys truck into the Mexican Express and raced it at Lions Drag Strip for seven years."
voices/harts-santa-ana.md: "C.J. \"Pappy\" Hart and Peggy Hart ran the Santa Ana drags from 1950 to 1959. Here are their own words and those of people who knew them."
voices/injection-and-tin.md: "First-hand words on lakes fuel injection, Lincoln-Mercury racing, Detroit aluminum work and East Coast match racing, from Stu Hilborn, Al Bergler, Malcolm Durham and others."
voices/kong-jackson.md: "Kong Jackson on the lakes before the SCTA, Army Jeeps at Muroc and flatheads, from Tom Medley's 1988 interview as quoted by Fuel Curve."
voices/leonard-miller.md: "Leonard Miller raced at Bucks County strips in the 1960s and in 1973 co-founded the Black American Racers Association. Here he tells it in his own words."
voices/peoria-1970.md: "The Rod & Custom crew who organized the first Street Rod Nationals in Peoria in 1970 remember the people who drove there."
voices/ray-godman.md: "Ray Godman, who ran the Tennessee Bo-Weevil cars and co-founded Lakeland Dragway, and his driver Preston Davis remember Memphis drag racing."
voices/ruelas-dukes.md: "The Ruelas brothers came from Tijuana to South Los Angeles in the mid-1950s, built cars with the Dukes car club, and in 2006 were still working on them in their yard."
voices/show-custom-voices.md: "Voices from the show and custom world: Mary Slonaker on Oakland in 1949–50, Jerry Titus on the KKOA in Wichita and Eddie Schartman on the first Funny Car."
voices/street-rodder-founding.md: "Tex Smith and Jim Clark remember how Street Rodder magazine got started in 1972 at Tom and Rose McMullen's TRM Publications."
voices/strip-owners-and-door-slammers.md: "Strip owners and door-slammer racers in their own words: the Harts, the Gays, Bob Bartel, Gene Snow and others, each quote labeled by when it was told."
voices/von-dutch.md: "Kenneth \"Von Dutch\" Howard is credited with reviving pinstriping. Here we separate his own few words from his friends' stories."
