site_name: Hot Rod History Wiki
site_description: A detective's archive of lesser-known hot rodding history, 1930s to today (focus pre-1990).
theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  font: false
  features:
    - navigation.instant
    - navigation.top
    - search.highlight
    - search.suggest
    - content.footnote.tooltips
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: {icon: material/weather-night, name: "Night at the drags"}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: {icon: material/weather-sunny, name: "Daylight"}
extra_css: [stylesheets/fonts.css, stylesheets/hotrod.css, stylesheets/era.css, stylesheets/magazine.css, stylesheets/home.css, stylesheets/highlights.css, stylesheets/connections.css, stylesheets/editorial.css, stylesheets/flow.css, stylesheets/quick-answers.css, stylesheets/storymap.css, stylesheets/print.css]
extra_javascript: [javascripts/hotrod.js, javascripts/highlights.js, javascripts/connections.js, javascripts/storymap.js]
extra:
  issues_url: https://github.com/obnovas/hotrod-wiki/issues/new
  feedback_url: https://github.com/obnovas/hotrod-wiki/issues/new?template=suggestion-feedback.yml
  masthead: Hot Rod History
  masthead_tag: The hometown history of hot rodding
  # Header shortcuts; the full department index lives behind the "Contents" button (built from `nav`).
  primary_nav:
    - {label: Eras, url: eras/}
    - {label: People, url: people/}
    - {label: Places, url: places/}
    - {label: Map, url: reference/story-map/}
    - {label: Voices, url: voices/}
    - {label: Quick answers, url: reference/quick-answers/}
    - {label: Timeline, url: reference/timeline/}
    - {label: About, url: about/what-makes-this-different/}
hooks:
  - hooks/design_hook.py   # must stay BEFORE highlights_hook (it peels the home intro off the slider placeholder)
  - hooks/articles_hook.py   # front-matter gate (fails the build), summary standfirst + meta description, first-mention links
  - hooks/connections_hook.py   # Web of influence graph; fails the build on an unsupported edge
  - hooks/quick_answers_hook.py   # Quick Answers page from docs/data/quick_answers.yml; fails the build on a bad answer
  - hooks/map_hook.py   # Story map page, hr-map.json and "See on the map" links, from docs/data/geo.yml
  - hooks/highlights_hook.py
  - hooks/redirects_hook.py
markdown_extensions: [footnotes, admonition, attr_list, md_in_html, toc: {permalink: true}, tables, pymdownx.snippets: {base_path: [snippets], check_paths: true}]
plugins:
  - search
  - glightbox
