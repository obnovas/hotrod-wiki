site_name: Hot Rod History Wiki
site_description: A detective's archive of lesser-known hot rodding history, 1930s to today (focus pre-1990).
theme:
  name: material
  features: [navigation.sections, navigation.indexes, search.highlight]
  palette: {scheme: slate, primary: red, accent: amber}
markdown_extensions: [footnotes, admonition, toc: {permalink: true}, tables]
nav:
  - Home: index.md
  - Eras:
      - eras/index.md
      - "1930s: Dry Lakes & the SCTA": eras/1930s-dry-lakes-scta.md
      - "1950s: Santa Ana & the First Drag Strip": eras/1950s-santa-ana-drags.md
      - "1956–64: The Camgrinder Wars": eras/1950s-camgrinder-wars.md
      - "1960s: The Drag Rags": eras/1960s-drag-rags.md
      - "1970s: Peoria & the Street Rod Resurgence": eras/1970s-street-rod-nationals.md
      - "1980s: Pro Street": eras/1980s-pro-street.md
  - People & Builders:
      - people/index.md
      - Ed Winfield: people/ed-winfield.md
      - George Riley: people/george-riley.md
      - Jimmy Summers: people/jimmy-summers.md
      - Barney Navarro: people/barney-navarro.md
      - Chet Herbert: people/chet-herbert.md
      - Alex Xydias: people/alex-xydias.md
      - Veda Orr: people/veda-orr.md
      - Roy Hagy: people/roy-hagy.md
      - George DuVall: people/george-duvall.md
      - Tom Beatty & the Glendale Strokers: people/tom-beatty.md
      - Doris Herbert: people/doris-herbert.md
      - Ed Almquist (Pennsylvania): people/ed-almquist.md
      - Peggy Hart: people/peggy-hart.md
      - Julian Doty: people/julian-doty.md
      - Ed Iskenderian: people/ed-iskenderian.md
      - Setto Postoian (Michigan): people/setto-postoian.md
  - Aftermarket Companies:
      - companies/index.md
      - Prewar Speed Shops (Bell, Lee's, Orr, White): companies/prewar-speed-shops.md
      - Edelbrock's Slingshot: companies/edelbrock-slingshot.md
      - Southern California Plating Co.: companies/southern-california-plating.md
      - Mr. Gasket (Ohio): companies/mr-gasket.md
  - Beyond California: regions/midwest-east.md
  - Cars:
      - cars/index.md
      - Hirohata Mercury: cars/hirohata-mercury.md
      - Beast III Streamliner: cars/beast-iii.md
  - Techniques & Styles: techniques/index.md
  - Research Trail: research-trail.md
  - Bibliography: bibliography.md
