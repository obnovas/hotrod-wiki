# Canonical facts: one home for each fact or story that more than one article tells.
#
#   page     the canonical article (the full story, with its footnotes and flags)
#   anchor   the section that tells it
#   snippet  the short shared statement in snippets/, included elsewhere with  --8<-- "<file>"
#   detect   a regex; any other article whose prose matches it must link to `page` or include the snippet
#   value    the agreed wording of the disputed numbers or dates (keep the flags on the canonical page)
#   oq       the canonical page's Open questions items behind each ⚠/◐ in value (q-N, or a ⚠ heading anchor).
#            Required when value carries ⚠ or ◐, and only then: the build fails if an item is gone (resolved),
#            is of the other kind, or the value carries a flag the page does not.
#
# scripts/check_articles.py enforces this at build time. Edit the snippet, not the copies.
facts:
  santa-ana-bayonets:
    page: eras/1950s-santa-ana-drags.md
    anchor: routed-by-bayonets
    snippet: santa-ana-bayonets.md
    detect: "Marines with fixed bayonets|Mile Square"
    value: "late 1940s; one source (MSHF biography) ◐"
    oq: [q-1]
  muroc-1941-jeeps:
    page: people/kong-jackson.md
