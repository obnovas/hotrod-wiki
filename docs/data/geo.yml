# Story map coordinates. One entry per place named in an article's `cities` front matter, and one per drag strip
# named in `strips`. The build (scripts/check_articles.py via scripts/geo_lib.py) fails when a story page names a
# city or strip that is not here. Hub pages are not checked.
#
# places:  'Town, State': {lat, lon, precision, source}
#   precision: town  = the Census internal point of the town (the default; used for strips and airports too)
#              county = the Census internal point of a county the article names instead of a town
#              site  = the exact spot, only when an article gives the location or a federal gazetteer names
#                      the feature itself (an airport, the salt flats)
#   source:    which public-domain dataset (Census Gazetteer 2024 or USGS GNIS) and the record matched.
#              Never type in coordinates from memory or a map app.
# strips:  'Strip name as in front matter': {place: 'Town, State'}  (the strip is pinned at that town)
# not_mapped: 'Name': reason  (outside the U.S., a district with no federal gazetteer point, and so on)
#
# Fill new towns with:  python scripts/geocode_places.py --gaz DIR --write   (see that script's docstring)

