# Highlights data for the home-page slider and the Highlights archive.
# Edit by hand or with: python scripts/update_highlights.py add --help
# Rules (enforced at build time, see scripts/highlights_lib.py and CONTRIBUTING.md):
#   * evidence: a phrase (or list) that must appear verbatim in the linked article. It proves the teaser
#     is grounded in the article, and it breaks the build if the article is later rewritten.
#   * Every number in the headline/teaser must appear in the article.
#   * image must be a file in docs/assets/images with a row in docs/reference/image-credits.md.
#   * grassroots: true only when the claim rests mainly on local news, oral history, obituaries, club or
#     municipal records, historical markers, family accounts or local-history sites.
#   * Newest 'added' date shows first; only the newest max_featured appear in the slider, the rest move
#     to the Highlights archive automatically.
settings:
  max_featured: 16

