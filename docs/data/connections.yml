# Every edge must name a supporting wiki page (`page`) and one or more `evidence` phrases that
# appear verbatim (after markdown/curly-quote normalisation) in that page. The build fails otherwise
# (hooks/connections_hook.py, scripts/connections_lib.py). Run `python scripts/check_connections.py`.
